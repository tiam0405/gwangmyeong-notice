<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>광명 임대주택 공고</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>광명 임대주택 공고</h1>
    <p id="updated" class="updated">불러오는 중…</p>
  </header>

  <section class="filters" aria-label="공고 거르기">
    <label class="check"><input type="checkbox" id="f-open" checked> 접수중·접수예정만</label>
    <label class="check"><input type="checkbox" id="f-hide-young" checked> 청년·신혼 전용 공고 숨기기</label>
    <div class="row">
      <select id="f-source" aria-label="기관"><option value="">모든 기관</option></select>
      <select id="f-type" aria-label="주택 유형"><option value="">모든 유형</option></select>
    </div>
    <select id="f-rent" aria-label="월세형·전세형">
      <option value="">월세형·전세형 모두</option>
      <option value="월세형">월세형 (보증금 + 매달 임대료)</option>
      <option value="전세형">전세형 (월세 없음·적음)</option>
    </select>
    <input type="search" id="f-q" placeholder="검색 (예: 하안, 영구임대)" aria-label="검색">
  </section>

  <p id="demo" class="demo" hidden>테스트 화면입니다. [테스트] 카드는 실제 공고가 아닙니다.</p>
  <p class="legend"><span class="swatch"></span> 초록 카드 = 광명 공고 · 아직 마감 전</p>
  <p id="count" class="count"></p>
  <main id="list"></main>

  <footer>
    <p>LH·GH·마이홈포털·광명시청·광명도시공사 공고를 하루 세 번 모읍니다.<br>
    자격·금액·일정은 반드시 <b>공고 원문</b>에서 확인하세요.</p>
  </footer>

  <template id="card-tpl">
    <article class="card">
      <button class="head" type="button" aria-expanded="false">
        <div class="badges"></div>
        <h2 class="title"></h2>
        <p class="meta region"></p>
        <p class="meta period"></p>
      </button>
      <div class="detail" hidden></div>
    </article>
  </template>

  <script src="app.js"></script>
</body>
</html>
